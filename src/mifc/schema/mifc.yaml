---
id: https://w3id.org/FoodDataCentral/mifc
name: mifc
title: mifc
description: |-
  The Minimum Information (about any) Food Composition (MIFC) data standard.
license: MIT
see_also:
  - https://FoodDataCentral.github.io/mifc

prefixes:
  mifc: https://w3id.org/FoodDataCentral/mifc/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: https://example.org/
  OBI: http://purl.obolibrary.org/obo/OBI_
  skos: http://www.w3.org/2004/02/skos/core#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  FDC: https://fdc.nal.usda.gov/
  PTFI: https://foodperiodictable.org/
default_prefix: mifc
default_range: string

imports:
  - linkml:types

classes:

  NamedThing:
    description: >-
      A generic grouping for any identifiable entity
    slots:
      - id
      - name
      - description
    class_uri: schema:Thing

  Food:
    is_a: NamedThing
    description: >-
      Represents a Food
    slots:
      - primary_email
      - birth_date
      - age_in_years
      - vital_status
      - test_int
    slot_usage:
      primary_email:
        pattern: "^\\S+@[\\S+\\.]+\\S+"

  PersonCollection:
    tree_root: true
    description: >-
      A holder for Food objects
    attributes:
      entries:
        range: Food
        multivalued: true
        inlined_as_list: true

  Container:
    tree_root: true
    description: >-
      A holder for Food, Component or Resource objects
    attributes:
      foods:
        multivalued: true
        inlined_as_list: true
        range: Food

slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    description: A unique identifier for a thing
  name:
    slot_uri: schema:name
    description: A human-readable name for a thing
  description:
    slot_uri: schema:description
    description: A human-readable description for a thing
  primary_email:
    slot_uri: schema:email
    description: The main email address of a person
  birth_date:
    slot_uri: schema:birthDate
    range: date
    description: Date on which a person is born
  age_in_years:
    range: integer
    description: Number of years since birth
  vital_status:
    range: PersonStatus
    description: living or dead status
  test_int:
    range: integer

enums:
  PersonStatus:
    permissible_values:
      ALIVE:
        description: the person is living
        meaning: PATO:0001421
      DEAD:
        description: the person is deceased
        meaning: PATO:0001422
      UNKNOWN:
        description: the vital status is not known
        todos:
          - map this to an ontology
