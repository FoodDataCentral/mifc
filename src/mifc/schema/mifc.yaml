---
id: https://w3id.org/FoodDataCentral/mifc
name: mifc
title: mifc
description: |-
  The Minimum Information (about any) Food Composition (MIFC) data standard.
license: CC0
see_also:
  - https://FoodDataCentral.github.io/mifc

prefixes:
  mifc: https://w3id.org/FoodDataCentral/mifc/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: https://example.org/
  OBI: http://purl.obolibrary.org/obo/OBI_
  skos: http://www.w3.org/2004/02/skos/core#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  FDC: https://fdc.nal.usda.gov/
  PTFI: https://foodperiodictable.org/
default_prefix: mifc
default_range: string

imports:
  - linkml:types

subsets:
  RecommendedSubset:
    title: recommended subset
    description: |-
      A subset of the MIFC slots that are required and recommended for use use in a Food Composition Table/Database.

classes:

  NamedThing:
    description: >-
      A generic grouping for any identifiable entity
    abstract: true     ## should not be instantiated directly serves as parent class only
    class_uri: schema:Thing

  Food:
    is_a: NamedThing
    description: >-
      Metadata about foods analyzed for components of nutritional interest.
    class_uri: schema:Food
    slots:
      - food_sample_id
      - food_description_label

  Container:
    tree_root: true
    description: >-
      A holder for Food, Component or Resource objects
    attributes:
      foods:
        multivalued: true
        inlined_as_list: true
        range: Food

slots:
  food_sample_id:
    range: string
  food_description_label:
    range: string

enums:
