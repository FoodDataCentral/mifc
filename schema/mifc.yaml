    in_subset:
    - RequiredSubset
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:component_data_points_number
    owner: Component
    domain_of:
    - Component
    range: integer
    required: true
    recommended: true
