name: mifc
description: The Minimum Information (about any) Food Composition (MIFC) data standard.
title: mifc
see_also:
- https://FoodDataCentral.github.io/mifc
id: https://w3id.org/FoodDataCentral/mifc
imports:
- linkml:types
license: CC0
prefixes:
  mifc:
    prefix_prefix: mifc
    prefix_reference: https://w3id.org/FoodDataCentral/mifc/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  biolink:
    prefix_prefix: biolink
    prefix_reference: https://w3id.org/biolink/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  PATO:
    prefix_prefix: PATO
    prefix_reference: http://purl.obolibrary.org/obo/PATO_
  example:
    prefix_prefix: example
    prefix_reference: https://example.org/
  OBI:
    prefix_prefix: OBI
    prefix_reference: http://purl.obolibrary.org/obo/OBI_
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  rdf:
    prefix_prefix: rdf
    prefix_reference: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  FDC:
    prefix_prefix: FDC
    prefix_reference: https://fdc.nal.usda.gov/
  PTFI:
    prefix_prefix: PTFI
    prefix_reference: https://foodperiodictable.org/
default_prefix: mifc
default_range: string
subsets:
