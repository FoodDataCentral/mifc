slots:
  food_sample_id:
    name: food_sample_id
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_sample_id
    description: A string denoting the primary identifier for a sample of the class
      Food. Note that food_sample_id should be unique in a given dataset and should
      be used to relate Food and Component records via component_sample_id from the
      Component class.
    notes:
    - 'Instead of `identifier: true` perhaps we can use unique_keys https://linkml.io/linkml/schemas/constraints.html'
    - 'identifier: true # Forces food_sample_id keys to be unique'
    examples:
    - value: CY121UM
    in_subset:
    - RequiredSubset
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_sample_id
    owner: Food
    domain_of:
    - Food
    range: string
    required: true
    recommended: true
  food_description_label:
    name: food_description_label
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_description_label
    description: A string clearly and unambiguous describing the sampled primary food
      material, in accordance with globally accepted guidelines for the description
      of foods.
    comments:
    - 'For reference see book by Greenfield and Southgate ''Food Composition Data:
      Production Management and Use'' ISBN-10 9251049491 and cited literature'
    examples:
    - value: Yam, raw
    in_subset:
    - RequiredSubset
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_description_label
    owner: Food
    domain_of:
    - Food
    range: string
    required: true
    recommended: true
  food_primary_type:
    name: food_primary_type
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_primary_type
    description: A controlled vocabulary term representing the primary food material
      which was sampled.
    comments:
    - The food_primary_type could be sourced from one of various food vocabularies
      such as USDA's FDC vocabulary, FoodEx2, LanguaL, or FoodOn.
    examples:
    - value: FOODON:03311865
    in_subset:
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    mappings:
    - schema:name
    exact_mappings:
    - FDC:NDB_number
    slot_uri: schema:name
    owner: Food
    domain_of:
    - Food
    range: string
    recommended: true
  food_description_match_type:
    name: food_description_match_type
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_description_match_type
    description: A value from a controlled vocabulary term representing the type of
      mapping between the food_description_label and food_primary_type_label.
    comments:
    - Note that the subject is the food_description_label and the object is food_primary_type_label
    - See https://github.com/mapping-commons/sssom/blob/master/src/sssom_schema/schema/sssom_schema.yaml
    examples:
    - value: skos:exactMatch
      description: Mappings assessed to indicate a high degree of confidence that
        the concepts expressed in the subject and object terms can be used interchangeably.
        In SKOS this is described as following the transitive property.
    - value: skos:closeMatch
      description: Mappings between the subject and object terms that convey a high
        degree of similarity, but are not exactly the same or interchangeable.
    - value: skos:broadMatch
      description: Mappings between a subject and object terms, where the object term
        is above the subject within a concept hierarchy.
    - value: skos:narrowMatch
      description: Mappings between a subject and object terms, where the object term
        that is below the subject within a concept hierarchy.
    - value: skos:relatedMatch
      description: Mappings between subject and object terms that might have some
        association but are not clearly not referring to the the same or similar concepts.
    in_subset:
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_description_match_type
    owner: Food
    domain_of:
    - Food
    range: SkosMatchType
    recommended: true
  food_primary_type_label:
    name: food_primary_type_label
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_primary_type_label
    description: A string denoting the label of a controlled vocabulary term representing
      the primary food material which was sampled.
    comments:
    - This field is to be used only for the string labels of from controlled vocabulary
      terms which are mapped to the food_description_label.
    examples:
    - value: piece of chicken (raw)
    in_subset:
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    close_mappings:
    - PTFI:Specimen_Food_Product_Name
    slot_uri: mifc:food_primary_type_label
    owner: Food
    domain_of:
    - Food
    range: string
    recommended: true
  food_primary_type_scientific_name:
    name: food_primary_type_scientific_name
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_primary_type_scientific_name
    description: A string denoting the scientific name, (in binomial nomenclature)
      of an organism that a food material is primarily composed of.
    comments:
    - This slot should only be used in cases where food materials are single ingredient
      foods or have a limited number of additives e.g. "salted Nori seaweed" or "filleted
      anchovies canned in oil".
    examples:
    - value: Gallus gallus
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_primary_type_scientific_name
    owner: Food
    domain_of:
    - Food
    range: string
  food_primary_type_cultivar_name:
    name: food_primary_type_cultivar_name
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_primary_type_cultivar_name
    description: A string denoting the cultivar name of the primary food material.
    examples:
    - value: Adirondack Blue
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_primary_type_cultivar_name
    owner: Food
    domain_of:
    - Food
    range: string
  food_primary_type_animal_breed_name:
    name: food_primary_type_animal_breed_name
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_primary_type_animal_breed_name
    description: A string denoting the breed name of the primary food material.
    comments:
    - This slot should only be used in cases where food material is an animal with
      a recognizable breed name that is managed by a national breed registry, breed
      association, or similar organization. E.g., "Wagyu" for the Wagu cattle breed.
    examples:
    - value: Wagyu
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_primary_type_animal_breed_name
    owner: Food
    domain_of:
    - Food
    range: string
  food_primary_type_ncbi_taxon_id:
    name: food_primary_type_ncbi_taxon_id
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_primary_type_ncbi_taxon_id
    description: A curie from the ontology representation of the NCBI organismal taxonomy
      (NCBITaxon) describing the taxonomic identifier of the primary food material.
    examples:
    - value: NCBITaxon:9031
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_primary_type_ncbi_taxon_id
    owner: Food
    domain_of:
    - Food
    range: uriorcurie
  food_upc_code:
    name: food_upc_code
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_upc_code
    description: An string denoting a Universal Product Code (UPC) barcode of a food
      sample.
    examples:
    - value: '40822011143'
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_upc_code
    owner: Food
    domain_of:
    - Food
    range: string
  food_preservation_state:
    name: food_preservation_state
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_preservation_state
    description: One or multiple values from an enumerated set of controlled vocabulary
      terms representing the preservation state(s) of a food sample.
    examples:
    - value: '[raw]'
    in_subset:
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_preservation_state
    owner: Food
    domain_of:
    - Food
    range: FoodPreservationState
    recommended: true
    multivalued: true
  food_storage_temperature_state:
    name: food_storage_temperature_state
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_storage_temperature_state
    description: One or multiple values from an enumerated set of controlled vocabulary
      terms representing the qualitative temperature state at which a food sample
      was stored prior to acquisition.
    examples:
    - value: '[frozen]'
    - value: '[frozen|refrigerated]'
    in_subset:
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_storage_temperature_state
    owner: Food
    domain_of:
    - Food
    range: FoodStorageTemperatureState
    recommended: true
    multivalued: true
  food_ripeness_state:
    name: food_ripeness_state
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_ripeness_state
    description: A value from a enumerated set of controlled vocabulary terms representing
      the qualitative freshness state of a food sample when prepared for analysis.
    examples:
    - value: unripe
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_ripeness_state
    owner: Food
    domain_of:
    - Food
    range: FoodRipenessState
  food_cooking_method:
    name: food_cooking_method
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_cooking_method
    description: One or multiple values from an enumerated set of controlled vocabulary
      terms representing the any cooking method(s) applied to a food sample prior
      to analysis.
    examples:
    - value: '[boiled|steamed]'
    in_subset:
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_cooking_method
    owner: Food
    domain_of:
    - Food
    range: FoodCookingMethod
    recommended: true
    multivalued: true
  food_origin_country:
    name: food_origin_country
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_origin_country
    description: A value from an enumerated set of controlled vocabulary terms denoting
      denoting the country code from which a food sample originates.
    examples:
    - value: AFG
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_origin_country
    owner: Food
    domain_of:
    - Food
    range: CountryCode
  food_acquisition_city:
    name: food_acquisition_city
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_acquisition_city
    description: A string denoting the city in which a food sample was acquired.
    examples:
    - value: Tucson
    from_schema: https://w3id.org/FoodDataCentral/mifc
    close_mappings:
    - PTFI:Collection_Location
    slot_uri: mifc:food_acquisition_city
    owner: Food
    domain_of:
    - Food
    range: string
  food_acquisition_country:
    name: food_acquisition_country
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_acquisition_country
    description: A value from an enumerated set of controlled vocabulary terms denoting
      denoting the country code from which a food sample was acquired.
    examples:
    - value: AFG
    in_subset:
    - RecommendedSubset
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_acquisition_country
    owner: Food
    domain_of:
    - Food
    range: CountryCode
    recommended: true
  food_acquisition_country_subdivision:
    name: food_acquisition_country_subdivision
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_acquisition_country_subdivision
    description: A string denoting the country subdivision (state or province) from
      which a food sample was acquired.
    examples:
    - value: PA
    from_schema: https://w3id.org/FoodDataCentral/mifc
    slot_uri: mifc:food_acquisition_country_subdivision
    owner: Food
    domain_of:
    - Food
    range: string
  food_acquisition_date:
    name: food_acquisition_date
    definition_uri: https://w3id.org/FoodDataCentral/mifc/food_acquisition_date
    description: A date value representing the date a food sample was acquired.
    examples:
    - value: '2023-03-08'
    in_subset:
